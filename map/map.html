        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function () {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function () {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function () {
                        popup.update();
                    });
                    setTimeout(function () {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        function pop_PlantasSolaresaNivelMundial_2(feature, layer) {
            var props = feature.properties;
            var status = String(props['Estado Operativo']);
            var statusClass = 'status-other';
            if (status === 'operating') statusClass = 'status-operating';
            else if (status === 'announced') statusClass = 'status-announced';
            else if (status === 'construction') statusClass = 'status-construction';
            else if (status === 'pre-construction') statusClass = 'status-pre-construction';

            // Keys hidden from data rows (shown in header already or irrelevant)
            // Note: we use key.trim().toLowerCase() before comparison, so no trailing spaces needed
            var skipKeys = ['nombre de la planta', 'pa\u00eds', 'estado operativo', 'tama\u00f1o', 'fid', 'objectid', 'code'];

            // Units map — keyed by original property name
            var units = {
                'Longitud (\u00b0)': '\u00b0',
                'Latitud (\u00b0)': '\u00b0',
                'Elevación (m.s.n.m.)': ' m.s.n.m.',
                '\u00c1rea (m\u00b2)': ' m\u00b2',
                'Pendiente (\u00b0)': '\u00b0',
                'Curvatura': '',
                'Aspecto (\u00b0)': '\u00b0',
                'Distancia a la V\u00eda (m)': ' m',
                'Temperatura Ambiente (\u00b0C)': ' \u00b0C',
                'GHI (kWh/m\u00b2)': ' kWh/m\u00b2',
                'Humedad (%)': ' %',
                'Velocidad del Viento (m/s)': ' m/s',
                'Direcci\u00f3n del Viento (\u00b0)': '\u00b0',
                'Aptitud Solar': '',
                'Aptitud Solar Redondeada': '',
                'Capacidad (MW)': ' MW',
                'Inclinaci\u00f3n \u00d3ptima (\u00b0)': '\u00b0',
                'Potencial Fotovolt\u00e1ico (kWh/kWp)': ' kWh/kWp'
            };

            var dataRows = '';
            for (var key in props) {
                var rawVal = props[key];
                if (rawVal === null || rawVal === '' || rawVal === undefined) continue;
                if (skipKeys.indexOf(key.trim().toLowerCase()) !== -1) continue;

                var unit = (units[key] !== undefined) ? units[key] : '';
                var displayVal = String(rawVal) + unit;
                var isCapacidad = (key === 'Capacidad (MW)');

                // Strip "(unit)" suffix from label for a cleaner display: "Longitud (°)" → "Longitud"
                var cleanLabel = key.trim().replace(/\s*\(.*?\)\s*$/, '');

                dataRows += `
                <div class="popup-row">
                    <span class="row-label">${cleanLabel}</span>
                    <span class="row-value${isCapacidad ? ' row-highlight' : ''}">${displayVal}</span>
                </div>`;
            }

            var plantName = props['Nombre de la Planta'] ? String(props['Nombre de la Planta']) : 'Planta Solar';
            var country = props['Pa\u00eds '] ? String(props['Pa\u00eds ']) : '';
            var size = props['Tama\u00f1o'] ? String(props['Tama\u00f1o']) : '';

            var popupContent = `
            <div class="popup-header">
                <h3 class="popup-title">${plantName}</h3>
                <div class="popup-meta">
                    ${country ? `<span class="popup-country">🌍 ${country}</span>` : ''}
                    ${size ? `<span class="popup-size"><i class="fas fa-expand-arrows-alt"></i> ${size}</span>` : ''}
                </div>
                <div class="status-badge ${statusClass}">${status}</div>
            </div>
            <div class="popup-body">
                ${dataRows}
            </div>`;

            layer.on('popupopen', function (e) {
                addClassToPopupIfMedia(popupContent, e.popup);
            });
            layer.bindPopup(popupContent, { maxHeight: 420 });
        }

            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: false,
        });
        lay.addTo(map);
        document.addEventListener("DOMContentLoaded", function () {
            // set new Layers List height which considers toggle icon
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height
                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            // toggle Collapsed/Expanded and apply new Layers List height
            toggleLayerControl.addEventListener('click', function () {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });
            // apply new Layers List height if toggle layerstree
            if (controlLayersElement) {
                controlLayersElement.addEventListener('click', function (event) {
                    var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
                    if (toggleLayerHeaderPointer) {
                        newLayersListHeight();
                    }
                });
            }
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function () {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function () {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen
            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function () {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }
        });
        setBounds();

        // Custom Legend Filtering Logic
        var activeStatuses = {
            'operating': true, 'announced': true, 'construction': true, 'pre-construction': true,
            'mothballed': true, 'shelved': true, 'cancelled': true, 'retired': true
        };

        function toggleLayer(statusCategory, event) {
            // Stop the click from bubbling up to Leaflet's layer tree checkbox
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            // Toggle active state
            activeStatuses[statusCategory] = !activeStatuses[statusCategory];

            // Toggle UI icon
            var icon = document.querySelector(`.toggle-icon[data-status="${statusCategory}"]`);
            if (activeStatuses[statusCategory]) {
                icon.classList.remove('far', 'fa-square');
                icon.classList.add('fas', 'fa-check-square', 'checked');
            } else {
                icon.classList.remove('fas', 'fa-check-square', 'checked');
                icon.classList.add('far', 'fa-square');
            }

            // Filter layers on the map
            cluster_PlantasSolaresaNivelMundial_2.clearLayers();
            var filteredLayers = [];
            var newTotal = 0;

            layer_PlantasSolaresaNivelMundial_2.eachLayer(function (layer) {
                var props = layer.feature.properties;
                var layerStatus = String(props['Estado Operativo']).toLowerCase().trim();

                // Handling grouped categories logic
                var categoryMatch = layerStatus;
                if (layerStatus.includes('shelved')) categoryMatch = 'shelved';
                if (layerStatus.includes('cancelled')) categoryMatch = 'cancelled';

                if (activeStatuses[categoryMatch]) {
                    filteredLayers.push(layer);
                    newTotal++;
                }
            });

            cluster_PlantasSolaresaNivelMundial_2.addLayers(filteredLayers);

            // Update UI total count
            document.getElementById('legend-total-count').innerText = newTotal.toLocaleString();

            // Re-apply max bounds if necessary to avoid breaking controls
            setTimeout(() => { map.invalidateSize(); }, 200);
        }
    </script>
</body>

</html>
